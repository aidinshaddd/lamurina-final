name: Lamurina static preview checks
on:
  push:
    branches: [developer, dev, test, stage, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lamurina-static-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Identify the production repository
        run: |
          echo 'This repository is a static preview. The live WordPress custom code is aidinshaddd/miladshabazi-lamurinagallery.com-. No host publication or branch force-promotion is performed here.' >> "$GITHUB_STEP_SUMMARY"
